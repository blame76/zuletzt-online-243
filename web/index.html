<!doctype html>
<html lang="de" data-theme="light" data-reading-mode="on" data-reading-menu="visible">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6f0">
  <meta name="description" content="Zuletzt online, ein Roman von Benjamin Lam. Direkt lesen oder vorlesen lassen.">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>Zuletzt online – Benjamin Lam</title>
</head>
<body>
  <a class="skip-link" href="#reader">Zum Text springen</a>
  <button type="button" id="reading-mode-toggle" class="reading-mode-toggle" aria-pressed="true" aria-label="Menü und Leseeinstellungen anzeigen" title="Menü und Leseeinstellungen anzeigen">Menü</button>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">z.</span>
      <div>
        <h1 class="brand-title">Zuletzt online</h1>
        
      </div>
    </div>
    <div class="tools" role="group" aria-label="Leseeinstellungen">
      <a class="about-link" href="/lesen/">Statisch lesen</a>
      <a class="about-link" href="/about/">Über</a>
      <button type="button" id="font-minus" aria-label="Schrift verkleinern" title="Schrift verkleinern">A−</button>
      <span id="font-value" class="font-value" aria-live="off">19 px</span>
      <button type="button" id="font-plus" aria-label="Schrift vergrößern" title="Schrift vergrößern">A+</button>
      <button type="button" id="theme" title="Darstellung wechseln">Dunkel</button>
    </div>
  </header>

  <div class="reading-bar">
    <label for="chapter">Abschnitt wählen</label>
    <select id="chapter" aria-label="Zum Manuskriptteil springen"></select>
    <span id="connectivity" class="connectivity" role="status"></span>
  </div>

  <div class="speech-tools" role="group" aria-label="Vorlesen"><button type="button" id="speech-toggle">▶ Vorlesen</button><label for="speech-speed">Tempo</label><select id="speech-speed"><option value="0.8">0,8×</option><option value="1" selected>1×</option><option value="1.25">1,25×</option></select><span id="speech-status" role="status" aria-live="polite"></span></div>
  <aside id="update-banner" class="update-banner" role="status" aria-live="polite" hidden>
    <span>Neue Version verfügbar.</span>
    <button type="button" id="update-load">Jetzt laden</button>
    <button type="button" id="update-later">Später</button>
  </aside>
  <div id="initial" class="initial" role="status" hidden>Manuskript wird geladen …</div>

  <div id="reading">
    <div class="location">
      <p id="status" aria-live="polite">Montag</p>
      <progress id="progress" aria-label="Lesefortschritt" value="0" max="1"></progress>
    </div>

    <noscript><p class="nojs-static">Die interaktive Ausgabe benötigt JavaScript. <a href="/lesen/">Den vollständigen Roman ohne JavaScript lesen.</a></p></noscript>
    <main id="reader" tabindex="-1"></main>

    <div class="navigation" aria-label="Durch den Text blättern">
      <button type="button" id="back" class="nav-button" disabled>Zurück</button>
      <button type="button" id="next" class="nav-button next" disabled>Weiter</button>
    </div>

    <footer class="foot">
      <p>© Benjamin Lam – alle Rechte am Roman vorbehalten.</p>
      <button type="button" id="restart" class="reset">Neu beginnen</button>
      <p><a href="/herr-behrens/">Herr Behrens – Ein Tag, ein Leben</a> · <a href="/lesen/">Lineare Lesefassung (ohne JavaScript)</a> · <a href="/about/">Über dieses Buch</a> · <a href="/impressum/">Impressum</a> · <a href="/datenschutz/">Datenschutz</a></p>
    </footer>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
